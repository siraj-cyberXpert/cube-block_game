<!DOCTYPE html>
<html>
<head>
<title>3D Runner Pro Game</title>
<style>
body { margin:0; overflow:hidden; }
</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// Scene Setup
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// Camera
let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);
camera.position.set(0,3,8);

// Renderer
let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Light
let light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
light.castShadow = true;
scene.add(light);

// Ground
let ground = new THREE.Mesh(
new THREE.BoxGeometry(30,1,10),
new THREE.MeshStandardMaterial({color:0x00aa00})
);
ground.position.y = -1;
ground.receiveShadow = true;
scene.add(ground);

// Player
let player = new THREE.Mesh(
new THREE.BoxGeometry(1,1,1),
new THREE.MeshStandardMaterial({color:0x0000ff})
);
player.position.y = 0;
player.castShadow = true;
scene.add(player);

// Obstacle
let obstacle = new THREE.Mesh(
new THREE.BoxGeometry(1,1,1),
new THREE.MeshStandardMaterial({color:0xff0000})
);
obstacle.position.set(10,0,0);
obstacle.castShadow = true;
scene.add(obstacle);

// Coins
let coin = new THREE.Mesh(
new THREE.SphereGeometry(0.3,16,16),
new THREE.MeshStandardMaterial({color:0xffff00})
);
coin.position.set(6,1,0);
scene.add(coin);

let score = 0;
let velocityY = 0;
let gravity = 0.03;
let jumping = false;

document.addEventListener("keydown",e=>{
if(e.code==="Space" && !jumping){
velocityY = 0.6;
jumping = true;
}
});

// Score Text
let scoreDiv = document.createElement("div");
scoreDiv.style.position="absolute";
scoreDiv.style.color="white";
scoreDiv.style.fontSize="25px";
scoreDiv.style.top="20px";
scoreDiv.style.left="20px";
document.body.appendChild(scoreDiv);

function animate(){

requestAnimationFrame(animate);

// Gravity
velocityY -= gravity;
player.position.y += velocityY;

if(player.position.y <= 0){
player.position.y = 0;
jumping = false;
}

// Move obstacle
obstacle.position.x -= 0.08;
if(obstacle.position.x < -10){
obstacle.position.x = 10;
}

// Coin movement
coin.position.x -= 0.05;
if(coin.position.x < -10){
coin.position.x = 10;
}

// Coin collection
if(Math.abs(player.position.x-coin.position.x)<1 &&
Math.abs(player.position.y-coin.position.y)<1){
score++;
coin.position.x = 10;
}

// Collision with obstacle
if(Math.abs(player.position.x-obstacle.position.x)<1 &&
Math.abs(player.position.y-obstacle.position.y)<1){
alert("Game Over Score: "+score);
location.reload();
}

// Camera follow
camera.position.x = player.position.x;
camera.lookAt(player.position);

scoreDiv.innerHTML="Score : "+score;

renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
